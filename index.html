<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momo's Laser – Pulsed Cleaning</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --black: #050505;
      --dark: #0e0e0e;
      --text: #e8e8e8;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }

    /* ── PAGE SYSTEM ── */
    .page {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .page.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.03);
    }

    /* Inner page overrides — becomes normal scrollable document */
    #inner {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      justify-content: flex-start;
      align-items: stretch;
    }
    #inner.active {
      position: fixed;
    }

    /* ── LANDING PAGE ── */
    #landing {
      background: radial-gradient(ellipse at 50% 60%, #1a1200 0%, var(--black) 70%);
      overflow: hidden;
    }
    #landing::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(201,168,76,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(201,168,76,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .logo-wrap {
      width: min(82vw, 500px);
      animation: floatIn 1.2s cubic-bezier(0.22,1,0.36,1) forwards;
      opacity: 0;
    }
    .logo-wrap img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 40px rgba(201,168,76,0.35));
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .enter-btn {
      margin-top: 2.5rem;
      padding: 0.85rem 3.5rem;
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: floatIn 1.2s 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
      opacity: 0;
      transition: color 0.3s, box-shadow 0.3s;
    }
    .enter-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
      z-index: 0;
    }
    .enter-btn:hover::before { transform: scaleX(1); }
    .enter-btn:hover { color: #000; box-shadow: 0 0 30px rgba(201,168,76,0.4); }
    .enter-btn span { position: relative; z-index: 1; }

    /* ── INNER PAGE ── */
    #inner.hidden { transform: scale(0.97); }

    /* Hero clean image */
    .hero-img-wrap {
      width: 100%;
      flex-shrink: 0;
      position: relative;
    }
    .hero-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }
    .hero-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 35%;
      background: linear-gradient(to top, var(--black) 0%, transparent 100%);
      pointer-events: none;
    }
    .hero-badge {
      position: absolute;
      top: 1.5rem; left: 50%;
      transform: translateX(-50%);
      font-family: 'Cinzel', serif;
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      letter-spacing: 0.4em;
      color: var(--gold);
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 0 20px rgba(201,168,76,0.6);
    }

    /* Carousel section */
    .carousel-section {
      width: 100%;
      padding: 2.5rem 1.2rem 1rem;
      background: var(--dark);
    }
    .carousel-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      letter-spacing: 0.3em;
      color: var(--gold);
      text-align: center;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    .carousel {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    .carousel-track {
      display: flex;
      gap: 1rem;
      transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    .carousel-slide {
      flex: 0 0 min(280px, 78vw);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(201,168,76,0.2);
      background: #111;
    }
    .carousel-slide img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .carousel-slide:hover img { transform: scale(1.04); }

    .carousel-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 1.2rem;
    }
    .c-btn {
      width: 40px; height: 40px;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.25s, color 0.25s;
    }
    .c-btn:hover { background: var(--gold); color: #000; }

    .c-dots {
      display: flex; gap: 6px;
    }
    .c-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(201,168,76,0.3);
      transition: background 0.3s, transform 0.3s;
      cursor: pointer;
    }
    .c-dot.active { background: var(--gold); transform: scale(1.4); }

    footer {
      text-align: center;
      padding: 2rem 1rem 2.5rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.1em;
      width: 100%;
    }
    footer a { color: var(--gold); text-decoration: none; }
  </style>
</head>

<script>
  function showInner() {
    document.getElementById('landing').classList.add('hidden');
    const inner = document.getElementById('inner');
    inner.classList.remove('hidden');
    inner.scrollTop = 0;
  }

  // Carousel
  const track = document.getElementById('track');
  const dotsEl = document.getElementById('dots');
  let current = 0;

  function getSlides() { return track.querySelectorAll('.carousel-slide'); }

  function buildDots() {
    dotsEl.innerHTML = '';
    getSlides().forEach((_, i) => {
      const d = document.createElement('button');
      d.className = 'c-dot' + (i === 0 ? ' active' : '');
      d.setAttribute('aria-label', 'Go to slide ' + (i+1));
      d.onclick = () => goTo(i);
      dotsEl.appendChild(d);
    });
  }

  function goTo(n) {
    const slides = getSlides();
    current = (n + slides.length) % slides.length;
    const slideW = slides[0].offsetWidth + 16; // gap
    track.style.transform = `translateX(${-current * slideW}px)`;
    dotsEl.querySelectorAll('.c-dot').forEach((d, i) =>
      d.classList.toggle('active', i === current));
  }

  function slide(dir) { goTo(current + dir); }

  buildDots();

  // Touch swipe
  let startX = 0;
  track.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive:true});
  track.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) slide(dx < 0 ? 1 : -1);
  }, {passive:true});
</script>
