<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Momo's Laser</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --black: #050505;
      --dark: #0e0e0e;
      --text: #e8e8e8;
    }

    html, body {
      min-height: 100%;
      background: var(--black);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
    }

    /* ── BACKGROUND ATMOSPHERE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.05) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(201,168,76,0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2rem;
      border-bottom: 1px solid rgba(201,168,76,0.15);
      background: rgba(5,5,5,0.85);
      backdrop-filter: blur(8px);
    }

    .header-logo {
      height: 52px;
      width: auto;
      display: block;
      filter: drop-shadow(0 0 12px rgba(201,168,76,0.3));
    }

    .back-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: var(--gold);
      text-decoration: none;
      text-transform: uppercase;
      border: 1px solid rgba(201,168,76,0.4);
      padding: 0.5rem 1.2rem;
      transition: background 0.25s, color 0.25s;
    }
    .back-btn:hover {
      background: var(--gold);
      color: #000;
    }

    /* ── MAIN LAYOUT ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 4rem;
    }

    .section-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.65rem, 2vw, 0.8rem);
      letter-spacing: 0.4em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 0.8rem;
    }

    h1 span {
      color: var(--gold);
    }

    .intro {
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      color: rgba(232,232,232,0.6);
      line-height: 1.7;
      margin-bottom: 2.8rem;
      font-weight: 300;
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 1.4rem;
    }

    label {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    input, textarea, select {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.2);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.85rem 1rem;
      outline: none;
      border-radius: 2px;
      transition: border-color 0.25s, background 0.25s;
      appearance: none;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(232,232,232,0.2);
      font-weight: 300;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--gold);
      background: rgba(201,168,76,0.05);
    }

    textarea {
      resize: vertical;
      min-height: 140px;
    }

    select option {
      background: #1a1a1a;
      color: var(--text);
    }

    /* two-col row */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
    }

    /* ── SUBMIT BUTTON ── */
    .submit-btn {
      margin-top: 0.6rem;
      width: 100%;
      padding: 1rem;
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color 0.3s;
    }
    .submit-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
      z-index: 0;
    }
    .submit-btn:hover::before { transform: scaleX(1); }
    .submit-btn:hover { color: #000; }
    .submit-btn span { position: relative; z-index: 1; }

    /* ── SUCCESS / ERROR STATES ── */
    .form-message {
      display: none;
      margin-top: 1.2rem;
      padding: 1rem 1.2rem;
      border-left: 3px solid var(--gold);
      background: rgba(201,168,76,0.07);
      font-size: 0.95rem;
      color: var(--gold-light);
      letter-spacing: 0.05em;
      line-height: 1.6;
    }
    .form-message.visible { display: block; }
    .form-message.error {
      border-color: #c0392b;
      background: rgba(192,57,43,0.07);
      color: #e87c6e;
    }

    /* ── DIVIDER ── */
    .divider {
      margin: 3rem 0;
      border: none;
      border-top: 1px solid rgba(201,168,76,0.12);
    }

    /* ── CONTACT INFO ── */
    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-size: 1rem;
      color: rgba(232,232,232,0.65);
      font-weight: 300;
    }

    .contact-item a {
      color: rgba(232,232,232,0.65);
      text-decoration: none;
      transition: color 0.2s;
    }
    .contact-item a:hover { color: var(--gold); }

    .contact-icon {
      width: 36px; height: 36px;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 0.95rem;
      color: var(--gold);
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem 1rem 2rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
      border-top: 1px solid rgba(201,168,76,0.08);
    }

    /* ── ENTRY ANIMATION ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    main { animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both; }
  </style>
</head>

<main>
  <div class="section-label">Get in touch</div>
  <h1>Let's <span>Clean</span><br>Something.</h1>
  <p class="intro">
    Request a demo, ask about our 300W pulsed laser system, or just say hello.
    We'll get back to you as soon as possible.
  </p>

  <!-- Replace YOUR_FORM_ID below with your Formspree form ID -->
  <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

    <div class="form-row">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="+353 ...">
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
      <label for="service">I'm interested in</label>
      <select id="service" name="service">
        <option value="">Select a service...</option>
        <option>Wood restoration &amp; surface cleaning</option>
        <option>Industrial equipment cleaning</option>
        <option>Automotive restoration</option>
        <option>Molds &amp; tooling cleaning</option>
        <option>Historical restoration</option>
        <option>Weld cleaning &amp; pre-treatment</option>
        <option>General enquiry</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell us about your project..." required></textarea>
    </div>

    <button type="submit" class="submit-btn"><span>Send Message</span></button>

    <div class="form-message" id="form-message"></div>
  </form>

  <hr class="divider">

  <div class="contact-info">
    <div class="contact-item">
      <div class="contact-icon">&#9742;</div>
      <a href="tel:+353870545663">087-0545663</a>
    </div>
    <div class="contact-item">
      <div class="contact-icon">&#9993;</div>
      <a href="mailto:momoslaser@gmail.com">momoslaser@gmail.com</a>
    </div>
    <div class="contact-item">
      <div class="contact-icon">&#9679;</div>
      <span>Ireland</span>
    </div>
  </div>
</main>

<script>
  const form = document.getElementById('contact-form');
  const msg  = document.getElementById('form-message');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = form.querySelector('.submit-btn span');
    btn.textContent = 'Sending...';

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if (res.ok) {
        msg.textContent = 'Message sent — we\'ll be in touch shortly.';
        msg.className = 'form-message visible';
        form.reset();
        btn.textContent = 'Send Message';
      } else {
        throw new Error('Server error');
      }
    } catch(err) {
      msg.textContent = 'Something went wrong. Please email us directly at momoslaser@gmail.com';
      msg.className = 'form-message visible error';
      btn.textContent = 'Send Message';
    }
  });
</script>
